<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>授权回调中...</title>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h3>授权成功！正在将凭证同步回主控制台...</h3>
    <script>
        (function() {
            const searchParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
            
            let token = searchParams.get('token') || searchParams.get('oauth_token') || 
                        searchParams.get('auth_token') || searchParams.get('code') ||
                        hashParams.get('token') || hashParams.get('access_token') || '';
                        
            if (window.parent) {
                window.parent.postMessage({
                    type: 'ICVE_OAUTH_SUCCESS',
                    token: token,
                    query: Object.fromEntries(searchParams.entries())
                }, '*');
            }
        })();
    </script>
</body>
</html>
